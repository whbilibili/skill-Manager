name: "Birchline"
philosophy: "Warm Document Craft. A technical tool that refuses cold aesthetics — amber-accented, paper-warm, precision-typed. The design language lives at the intersection of a well-typeset document and a developer's editor."
primary_mode: "light"
brand_domain: "prompt engineering / AI tooling / developer productivity"
brand_type: "ui-rich"
mono_for_code: true
mono_for_metrics: false

# ── PRIMITIVES ── Raw scales derived from brand analysis
primitives:
  colors:
    neutral:    # Warm-tinted — never pure gray, always a hint of amber/sand
      50:  "#FDFAF5"
      100: "#F8F3EA"
      200: "#F0E9DA"
      300: "#E4D9C8"
      400: "#C8BAA4"
      500: "#A89880"
      600: "#7A6E5F"
      700: "#5A5048"
      800: "#3D3530"
      900: "#2C2416"
      950: "#1A1510"
    brand:      # Amber-orange — warm, editorial, not neon
      50:  "#FDF6EC"
      100: "#FAEBD4"
      200: "#F5D4A8"
      300: "#EDB96E"
      400: "#E09A42"
      500: "#C17B3A"
      600: "#A36228"
      700: "#844D1E"
      800: "#653B17"
      900: "#472A10"
      950: "#2A1808"
    red:   { 50: "#FEF2F2", 500: "#DC4A4A", 900: "#7F1D1D" }
    green: { 50: "#F0FDF4", 500: "#4A9B6A", 900: "#14532D" }
    amber: { 50: "#FFFBEB", 500: "#D97706", 900: "#78350F" }

  spacing: [0, 2, 4, 8, 12, 16, 20, 24, 32, 48, 64, 96]
  radii: [0, 4, 6, 8, 12, 16, 999]

# ── SEMANTIC TOKENS ── Roles that reference primitives
tokens:
  colors:
    light:
      background:     "{neutral.100}"   # #F8F3EA — warm paper
      surface1:       "{neutral.50}"    # #FDFAF5 — cards, panels
      surface2:       "{neutral.100}"   # #F8F3EA — nested surfaces
      surface3:       "{neutral.200}"   # #F0E9DA — inputs, wells, inset areas
      border:         "{neutral.200}"   # #F0E9DA — subtle dividers
      border_visible: "{neutral.300}"   # #E4D9C8 — intentional borders
      text1:          "{neutral.900}"   # #2C2416 — headings, body
      text2:          "{neutral.600}"   # #7A6E5F — descriptions, labels
      text3:          "{neutral.500}"   # #A89880 — placeholders, timestamps
      text4:          "{neutral.400}"   # #C8BAA4 — disabled
      accent:         "{brand.500}"     # #C17B3A — amber, interactive
      accent_subtle:  "{brand.50}"      # #FDF6EC — tinted backgrounds
    dark:
      background:     "{neutral.950}"   # #1A1510
      surface1:       "{neutral.900}"   # #2C2416
      surface2:       "{neutral.800}"   # #3D3530
      surface3:       "{neutral.700}"   # #5A5048
      border:         "{neutral.800}"   # #3D3530
      border_visible: "{neutral.700}"   # #5A5048
      text1:          "{neutral.50}"    # #FDFAF5
      text2:          "{neutral.300}"   # #E4D9C8
      text3:          "{neutral.500}"   # #A89880
      text4:          "{neutral.600}"   # #7A6E5F
      accent:         "{brand.400}"     # #E09A42
      accent_subtle:  "{brand.950}"     # #2A1808
    success: "{green.500}"
    warning: "{amber.500}"
    error:   "{red.500}"

  spacing:
    2xs: 2
    xs:  4
    sm:  8
    md:  16
    lg:  24
    xl:  32
    2xl: 48
    3xl: 64
    4xl: 96

  radii:
    element:   4    # checkboxes, small icons
    control:   6    # buttons, inputs
    component: 8    # cards, panels
    container: 12   # modals, sheets
    pill:      999  # slot tags, status badges

  typography:
    display:  { family: "DM Sans",      size: "28px", weight: 600, line_height: 1.2 }
    heading:  { family: "DM Sans",      size: "20px", weight: 600, line_height: 1.3 }
    body:     { family: "DM Sans",      size: "14px", weight: 400, line_height: 1.6 }
    body_sm:  { family: "DM Sans",      size: "13px", weight: 400, line_height: 1.5 }
    caption:  { family: "DM Sans",      size: "11px", weight: 500, line_height: 1.4 }
    label:    { family: "DM Sans",      size: "11px", weight: 600, line_height: 1.3, letter_spacing: "0.06em", text_transform: "uppercase" }
    mono:     { family: "JetBrains Mono", size: "13px", weight: 400, line_height: 1.5 }

  elevation:
    strategy: "subtle"
    shadow_1_light: "0 1px 3px rgba(44, 36, 22, 0.06), 0 1px 2px rgba(44, 36, 22, 0.04)"
    shadow_2_light: "0 4px 12px rgba(44, 36, 22, 0.08), 0 2px 4px rgba(44, 36, 22, 0.05)"
    shadow_3_light: "0 8px 32px rgba(44, 36, 22, 0.12), 0 4px 8px rgba(44, 36, 22, 0.06)"
    shadow_1_dark:  "0 1px 3px rgba(0, 0, 0, 0.25), 0 1px 2px rgba(0, 0, 0, 0.15)"
    shadow_2_dark:  "0 4px 12px rgba(0, 0, 0, 0.35), 0 2px 4px rgba(0, 0, 0, 0.20)"
    shadow_3_dark:  "0 8px 32px rgba(0, 0, 0, 0.45), 0 4px 8px rgba(0, 0, 0, 0.25)"

  motion:
    personality: "smooth"
    easing: "ease-in-out"
    duration_fast: "120ms"
    duration_normal: "200ms"
    duration_slow: "300ms"

  hero_stage:
    preset: "flat-blank"
    observed_style:
      description: "No background decoration. The page background is warm paper (#F8F3EA). Content is the hero — a two-column editor layout with template on the left and live preview on the right. No gradients, no imagery, no visual noise."
      where_used: ["all pages"]
    background:
      medium: "absent"
      color_mode: "brand-tinted-neutral"
      saturation: "flat"
      light_source: "none"
      falloff: "hard"
      vignette: "off"
      texture: "clean"
      motion: "static"
      intensity: "subtle"
      safe_zone: "full-bleed"
      color_palette: ["#F8F3EA", "#C17B3A", "#2C2416"]
    hero:
      subject: "none"
    relation:
      type: "flat"
      bleed: 0
    disclaimer: "This brand uses no hero background — the warm paper surface IS the identity. Do not add gradients or decorative backgrounds."

  iconography:
    observed_style:
      description: "Minimal usage. Breadcrumb separators use '/' text. No icon library visible in the UI — the design relies on typography and color, not icons."
      stroke_weight: "regular"
      corner_treatment: "soft"
      fill_style: "outline"
      form_language: "geometric"
      visual_density: "minimal"
    fallback_kit:
      name: "Lucide"
      weight: "regular"
      match_score: "high"
      match_reasoning: "Lucide's clean geometric outlines at 1.5px stroke match the minimal, precise character of the Birchline UI. Phosphor would be second choice but is slightly more rounded than the brand's sharp-but-soft aesthetic."
      cdn: "https://unpkg.com/lucide-static/font/lucide.css"
      icon_class_prefix: "lucide lucide-"
    disclaimer: "Icons in the generated preview are a best-match fallback from Lucide. The brand uses minimal iconography — typography and color carry the visual weight."

components:
  # Observed components from screenshot analysis
  button_primary:
    source: "observed"
    background: "{neutral.900}"    # #2C2416 — dark warm brown
    color: "{neutral.50}"          # #FDFAF5
    padding: "8px 16px"
    radius: "{radii.control}"      # 6px
    font_weight: 500
    font_size: "13px"
    hover: { background: "{neutral.800}" }

  button_secondary:
    source: "observed"
    background: "{neutral.200}"    # #F0E9DA
    color: "{neutral.700}"         # #5A5048
    padding: "8px 16px"
    radius: "{radii.control}"
    font_weight: 500
    font_size: "13px"
    border: "1px solid {neutral.300}"
    hover: { background: "{neutral.300}" }

  slot_tag:
    source: "observed"
    background: "{brand.100}"      # #FAEBD4
    color: "{brand.600}"           # #A36228
    padding: "2px 8px"
    radius: "{radii.pill}"
    font_family: "JetBrains Mono"
    font_size: "12px"
    font_weight: 400

  plan_badge:
    source: "observed"
    # Variants: free (green), team (blue), studio (purple)
    free:   { background: "#E8F0E0", color: "#3A6B2A" }
    team:   { background: "#E0EAF5", color: "#2A4A7A" }
    studio: { background: "#EDE0F5", color: "#5A2A7A" }
    padding: "2px 8px"
    radius: "{radii.pill}"
    font_size: "11px"
    font_weight: 600
    text_transform: "uppercase"
    letter_spacing: "0.04em"

  section_label:
    source: "observed"
    color: "{neutral.500}"
    font_size: "11px"
    font_weight: 600
    text_transform: "uppercase"
    letter_spacing: "0.06em"

  card:
    source: "observed"
    background: "{neutral.50}"
    border: "1px solid {neutral.200}"
    radius: "{radii.component}"    # 8px
    padding: "20px"
    shadow: "{shadow_1_light}"

  textarea_template:
    source: "observed"
    background: "{neutral.50}"
    border: "1px solid {neutral.200}"
    radius: "{radii.component}"
    padding: "16px"
    font_family: "DM Sans"
    font_size: "14px"
    line_height: 1.6
    focus_border: "1px solid {brand.400}"

  breadcrumb:
    source: "observed"
    font_size: "11px"
    font_weight: 600
    text_transform: "uppercase"
    letter_spacing: "0.06em"
    color: "{neutral.500}"
    separator: "/"
    separator_spacing: "6px"
    active_color: "{neutral.700}"

app_screen:
  archetype: "editor"
  frame: "browser"
  frame_params:
    url: "app.birchline.dev/prompts/support-reply"
    title: "Birchline — Prompt Tuner"
  content_seed: "Support reply prompt editor with template slots and live sample preview"
  required_tokens_checklist:
    - "background, surface1, surface2, surface3, border, border_visible"
    - "text1, text2, text3, text4"
    - "accent, accent_subtle, success, warning, error"
    - "all typography scale tokens"
    - "all spacing tokens used in components"
